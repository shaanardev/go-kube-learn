name: Go review

on:
  pull_request:
    paths:
      - "**/*.go"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-review.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  go-review:
    name: Go static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Go source files
        id: go-sources
        shell: bash
        run: |
          if find . -type f -name '*.go' -not -path './.git/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain skipped analysis
        if: steps.go-sources.outputs.present != 'true'
        run: echo "::notice::No Go source files yet; Go review will start when the first .go file is added."

      - name: Lint Go code with reviewdog
        if: steps.go-sources.outputs.present == 'true'
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2 # v2.10.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          go_version_file: go.mod
          golangci_lint_version: v2.15.0
          golangci_lint_flags: "--timeout=3m --issues-exit-code=0"
          reporter: github-pr-review
          filter_mode: added
          level: warning
          fail_level: none
